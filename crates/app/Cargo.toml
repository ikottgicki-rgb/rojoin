[package]
name = "rojoin-v4"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RoJoin v4 — native Roblox client"

[[bin]]
name = "rojoin-v4"
path = "src/main.rs"

[dependencies]
rojoin-roblox.workspace = true
rojoin-store.workspace = true
rojoin-launcher.workspace = true
rojoin-macro.workspace = true

slint.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
image.workspace = true
chrono.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
webbrowser = "1"
# The tray icon itself is cross-platform: Shell_NotifyIcon on Windows, the
# StatusNotifierItem protocol on Linux.
tray-icon = "0.19"

# Cookies live in the OS keyring, never in config.json. The backend is
# cfg-gated so the Windows cross-build never tries to link secret-service.
[target.'cfg(unix)'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
notify-rust = "4"
# tray-icon needs a GTK main loop on Linux, and the gtk crate version has to
# match the one it was built against. Unix-only, so the Windows cross-build
# never sees it.
gtk = "0.18"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# The tray icon's own hidden window needs its messages pumped, and that has to
# happen on the thread that created it.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
